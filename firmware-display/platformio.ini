; Inversa Display — Secondary BLE-central UI device.
;
; Target: Waveshare ESP32-S3 1.47" LCD Touch (JD9853 + AXS5106L, 172x320).
; Role: BLE central. Connects to the brewing controller (hil_s3_mini /
;       wemos_s3_mini env) via Nordic UART Service, mirrors evt:* state
;       into LVGL widgets, sends req:* on touch.
;
; Stack: LovyanGFX (display) + LVGL v9 (UI framework + touch indev) +
;        NimBLE-Arduino (BLE central) + ArduinoJson (parse evt:*).
; UI source: hand-written placeholders in src/ui/, plus SquareLine Studio
;            exports dropped into src/ui/sq/ (gitignored output dir is
;            optional; commit if you want round-tripping).

[platformio]
default_envs = waveshare_s3_lcd147
src_dir = src
lib_dir = lib

[env:waveshare_s3_lcd147]
platform = https://github.com/pioarduino/platform-espressif32#54.03.21-2
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; PSRAM is required for LVGL double-buffer (172*320*2 = 110 KB per buf).
; The ESP32-S3-DevKitC-1 variant Waveshare uses ships with octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default.csv
board_upload.flash_size = 16MB

lib_deps =
    ; Arduino_GFX has documented JD9853 support and is what the Waveshare
    ; ESP32-S3-Touch-LCD-1.47 reference code (VolosR/Wave147moreExamples)
    ; uses. LovyanGFX 1.x has no first-class JD9853 panel class, so the
    ; previous attempt to lean on Panel_ST7789 left the display dark.
    moononournation/GFX Library for Arduino@^1.5.0
    lvgl/lvgl@^9.1.0
    h2zero/NimBLE-Arduino@^2.3.0
    bblanchon/ArduinoJson@^7.4.1

build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_USE_MALLOC=1
    ; LVGL config: project ships its own lv_conf.h under include/.
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I src
    ; SquareLine Studio integration. Uncomment after dropping a real
    ; export into src/ui/sq/ (see src/ui/sq/README.md). Without the flag,
    ; handwritten screens under src/screens/*.cpp own the UI.
    -D USE_SQUARELINE_UI
    ; NimBLE size optimizations — we only act as a central, so disable
    ; peripheral / broadcaster roles.
    -D CONFIG_NIMBLE_CPP_ATT_VALUE_INIT_LENGTH=256
    -D CONFIG_BT_NIMBLE_LOG_LEVEL=0
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
