name: Build Android APK

# Builds the React Native app as a sideloadable APK and attaches it to
# the GitHub Release for the same tag. Decoupled from `platformio.yml`
# because firmware and app rebuilds happen on different cadences and we
# don't want a JS change to gate a firmware release (or vice-versa).
#
# Caching: a SHA-256 fingerprint of every file that can affect the APK
# bytes (app sources, shared packages, lockfile, Expo/Gradle configs,
# the workflow itself, and the keystore secrets when present) gates
# whether we actually re-run Gradle. When the fingerprint matches a
# previous run we restore the cached APK and rename it for the current
# tag — typically <5 s instead of the full ~7-12 min build.
#
# Signing strategy: starts out with the standard Android debug keystore
# so anyone can sideload the APK for testing without provisioning a
# release keystore. When the project is ready to ship through stores,
# wire in `ANDROID_KEYSTORE_BASE64` + `ANDROID_KEYSTORE_PASSWORD` +
# `ANDROID_KEY_ALIAS` + `ANDROID_KEY_PASSWORD` Secrets and the workflow
# will pick those up automatically. Provisioning the keystore changes
# the fingerprint, so the first release-signed run rebuilds from
# scratch and is cached separately from the debug-signed builds.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS Update channel to bake into the APK (dev builds use this)"
        type: choice
        default: dev
        options: [dev, rc, production]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute APK fingerprint
        id: fp
        env:
          # Hashing a presence flag (not the secret itself) so the
          # cache key changes the moment the project starts producing
          # release-signed APKs instead of debug-signed ones.
          HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '1' || '0' }}
        # Only files that change the native APK contents go into the
        # hash. JS source under `apps/native/src/`, `packages/**` etc
        # ships through the EAS Update bundle channel — the APK
        # doesn't have to be rebuilt for those, and including them
        # would cause every release to bust the cache for no benefit.
        # The Expo runtime fingerprint policy uses essentially this
        # same input set; staying narrow keeps APK cache hits aligned
        # with EAS Update's "runtime compatibility" semantics.
        run: |
          set -euo pipefail
          # Anything that bumps the native binary:
          #   - app.json: package id, permissions, plugins, native config
          #   - eas.json: build profile / channel mapping
          #   - package.json + lockfile: native dep versions (RN, BLE plx,
          #     Tamagui native modules, expo plugins)
          #   - this workflow file: gradle args, keystore flow
          # `apps/native/plugins/**` and `apps/native/android/**`
          # (when committed) feed the prebuild too — include them if
          # they exist.
          INPUTS=$(
            ls -1 \
              apps/native/app.json \
              apps/native/app.config.js \
              apps/native/eas.json \
              package.json \
              package-lock.json \
              .github/workflows/android-apk.yml \
              2>/dev/null
            find apps/native/plugins -type f 2>/dev/null || true
            find apps/native/android -type f \
              -not -path '*/build/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/.cxx/*' \
              2>/dev/null || true
          )
          HASH=$(
            { echo "$INPUTS" | sort -u | xargs sha256sum 2>/dev/null;
              echo "release-keystore=$HAS_RELEASE_KEYSTORE";
            } | sha256sum | cut -d' ' -f1
          )
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "cache-dir=.cache/apk/$HASH" >> "$GITHUB_OUTPUT"
          mkdir -p ".cache/apk/$HASH"
          echo "Fingerprint: $HASH"
          echo "Inputs counted: $(echo "$INPUTS" | sort -u | wc -l)"

      # The APK bakes the EAS Update channel it listens to (app.config.js reads
      # EXPO_CHANNEL). Tag pushes derive it from the tag (pre-release → rc,
      # stable → production); a manual run uses the workflow input (default dev).
      # Resolved before the cache so the channel is part of the cache key —
      # otherwise a dev build could be served a cached production APK.
      - name: Resolve EAS channel
        id: channel
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            c="${{ github.event.inputs.channel }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF}" == *-* ]]; then
            c=rc
          else
            c=production
          fi
          echo "name=$c" >> "$GITHUB_OUTPUT"
          echo "APK channel: $c"

      - name: Restore cached APK
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.fp.outputs.cache-dir }}
          key: apk-v1-${{ steps.channel.outputs.name }}-${{ steps.fp.outputs.hash }}

      # Everything below is gated on a cache miss so we only pay the
      # ~10 min toolchain bootstrap when the fingerprint actually
      # changes.
      - name: Set up Node
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java 17
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install workspace
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Expo prebuild
        # Generates the `android/` Gradle project from app.json + app.config.js.
        # Run with `--clean` so a fresh build always regenerates the native
        # shell (versionCode/manifest/channel changes etc.). EXPO_CHANNEL is
        # baked into AndroidManifest via app.config.js.
        if: steps.apk-cache.outputs.cache-hit != 'true'
        env:
          EXPO_CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          cd apps/native
          npx expo prebuild --platform android --clean

      # If a release keystore is provisioned in Secrets, decode it and
      # configure Gradle. Without secrets the build falls through to the
      # debug keystore — still installable, just not store-grade.
      - name: Decode release keystore (optional)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p apps/native/android/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/native/android/app/release.keystore
            echo "Release keystore decoded ($(stat -c %s apps/native/android/app/release.keystore || stat -f %z apps/native/android/app/release.keystore) bytes)"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — debug-keystore APK will be produced."
          fi

      - name: Bump Gradle / Kotlin daemon memory
        # `expo prebuild` writes `apps/native/android/gradle.properties`
        # from scratch on every run, so we patch the generated file
        # rather than carrying our own copy in git. The defaults from
        # `expo prebuild` (Xmx2g / no metaspace cap) make the KSP
        # daemon flood the build with `OutOfMemoryError: Metaspace`
        # once Kotlin compilation hits expo-updates + reanimated +
        # worklets simultaneously. GitHub hosted Linux runners have
        # 14 GB RAM, so giving Gradle 6 GB heap + 2 GB metaspace and
        # Kotlin its own 2 GB daemon is well within budget.
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          GP=apps/native/android/gradle.properties
          {
            echo ""
            echo "# Bumped from the CI workflow — see android-apk.yml"
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.workers.max=4"
          } >> "$GP"
          echo "Final $GP:"
          tail -20 "$GP"

      - name: Ensure Android debug keystore exists
        # `assembleDebug` (used as a fallback signing identity when no
        # production keystore is provisioned) needs ~/.android/debug.keystore
        # to exist. The runner usually has it, but a fresh image
        # occasionally doesn't — generate it ourselves with the standard
        # debug credentials so the release-mode build always finds a key.
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          KS=~/.android/debug.keystore
          if [ ! -f "$KS" ]; then
            mkdir -p ~/.android
            keytool -genkeypair \
              -keystore "$KS" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated debug keystore at $KS"
          fi

      - name: Build APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Always `assembleRelease` so the JS bundle is baked into the
        # APK — `assembleDebug` would emit an APK that expects to find
        # Metro on localhost:8081, which a sideloaded user obviously
        # cannot satisfy. When the production keystore secrets are not
        # set we sign with the Android debug keystore instead, which
        # still produces a standalone, installable APK; it just won't
        # be accepted by Play Store / Amazon.
        run: |
          cd apps/native/android
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease \
              -PRELEASE_STORE_FILE=app/release.keystore \
              -PRELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            FLAVOR=release
          else
            ./gradlew assembleRelease \
              -PRELEASE_STORE_FILE=$HOME/.android/debug.keystore \
              -PRELEASE_STORE_PASSWORD=android \
              -PRELEASE_KEY_ALIAS=androiddebugkey \
              -PRELEASE_KEY_PASSWORD=android
            FLAVOR=release-debugsigned
          fi
          echo "FLAVOR=$FLAVOR" >> "$GITHUB_ENV"

      - name: Stage APK into cache dir (miss path)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        env:
          CACHE_DIR: ${{ steps.fp.outputs.cache-dir }}
        run: |
          APK=$(find apps/native/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" "$CACHE_DIR/app.apk"
          echo "$FLAVOR" > "$CACHE_DIR/flavor"
          sha256sum "$CACHE_DIR/app.apk" | tee "$CACHE_DIR/sha256"

      - name: Recover APK from cache (hit path)
        if: steps.apk-cache.outputs.cache-hit == 'true'
        env:
          CACHE_DIR: ${{ steps.fp.outputs.cache-dir }}
        run: |
          test -f "$CACHE_DIR/app.apk"
          test -f "$CACHE_DIR/flavor"
          echo "FLAVOR=$(cat "$CACHE_DIR/flavor")" >> "$GITHUB_ENV"
          # Print the recorded sha256 next to a live re-hash so a
          # corrupted cache shows up loudly in the log instead of
          # silently shipping the wrong bytes.
          echo "Recorded:"
          cat "$CACHE_DIR/sha256"
          echo "Live:"
          sha256sum "$CACHE_DIR/app.apk"

      - name: Locate APK for upload
        id: apk
        env:
          CACHE_DIR: ${{ steps.fp.outputs.cache-dir }}
        run: |
          DEST="brewpilot-${{ github.ref_name }}-android-${FLAVOR}.apk"
          cp "$CACHE_DIR/app.apk" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          # Don't overwrite the firmware notes — append the APK.
          append_body: true

      - name: Upload as workflow artifact
        # Always uploaded as a workflow run artifact so the manual
        # `workflow_dispatch` flow has something to download even when
        # there is no tag to attach the file to.
        uses: actions/upload-artifact@v4
        with:
          name: brewpilot-android-apk
          path: ${{ steps.apk.outputs.path }}
