name: Web App CI

on:
  push:
    branches:
      - develop
      - v2
      - v3
      - v4-tamagui
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches:
      - develop
      - v2
      - v3
      - v4-tamagui
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

jobs:
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
