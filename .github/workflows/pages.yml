name: Deploy GitHub Pages

# Publishes the firmware installer (static `docs/`) together with the
# Tamagui web app (`apps/web` built with `VITE_BASE=/brewpilot/app/`).
# Replaces the previous "deploy from branch" Pages source so we never
# have to commit built assets.

on:
  push:
    branches: [develop]
    paths:
      - "docs/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Newer pushes supersede in-flight deploys; never tear down a deploy
# that is mid-flight because that would leave the site in a half state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace
        run: npm ci

      - name: Build web app with Pages base path
        run: npm run web:build:pages

      # GitHub release assets are served without CORS headers, so the
      # ESP Web Tools <esp-web-install-button> can't fetch them from
      # the cross-origin Pages site. Pull the factory bins server-side
      # here and bundle them inside the Pages artifact so the manifest
      # points at same-origin URLs. The step is best-effort: if the
      # current release predates the factory.bin asset, we still ship
      # the installer page (the button just won't flash until a fresh
      # tag uploads a working factory bin).
      - name: Stage factory bins from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p docs/firmware
          for board in wemos_s3_mini wemos_c3_mini; do
            if gh release download --repo ${{ github.repository }} \
                 --pattern "${board}.factory.bin" \
                 --dir docs/firmware --clobber; then
              echo "✓ staged ${board}.factory.bin"
            else
              echo "::warning::No ${board}.factory.bin in latest release (older tag?); installer will 404 until a tag with merge_bin lands."
            fi
          done

      - name: Assemble site
        # docs/ already contains the installer index.html + manifests;
        # the web app was just emitted into docs/app/, and the factory
        # bins (if any) landed in docs/firmware/. Upload docs/ as the
        # Pages artifact root so the installer lives at `/brewpilot/`,
        # the PWA at `/brewpilot/app/`, and bins at `/brewpilot/firmware/`.
        run: |
          test -f docs/index.html
          test -f docs/app/index.html
          ls -la docs/firmware/ || echo "no firmware bins yet"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
