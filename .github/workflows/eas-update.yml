name: Publish EAS Update

# Ships JS-only updates of the React Native app via EAS Update on every
# tag push. Users with a compatible runtime (same native build) get the
# new bundle silently on the next launch — no APK reinstall, no Play
# Store roundtrip. Native-code changes (new BLE permission, lib bump)
# bump the runtime fingerprint, so the OTA channel is automatically
# skipped for clients that need a fresh APK first.
#
# Requires the EXPO_TOKEN repository Secret. Generate one at
# https://expo.dev/accounts/<owner>/settings/access-tokens, then:
#   gh secret set EXPO_TOKEN -R ggazzo/brewpilot --body "<token>"
# Without it the workflow no-ops with a warning so the rest of CI keeps
# working.

on:
  push:
    branches:
      - develop        # → `dev` channel (latest develop JS)
    tags:
      - "v*"           # rc tag → `rc`, stable tag → `production`
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: eas update --auto
    runs-on: ubuntu-latest
    steps:
      - name: Guard on EXPO_TOKEN
        id: guard
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN secret not configured — skipping EAS Update publish. Generate a token at https://expo.dev/accounts/<owner>/settings/access-tokens and set it with 'gh secret set EXPO_TOKEN'."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == '0'

      - name: Set up Node
        if: steps.guard.outputs.skip == '0'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace
        if: steps.guard.outputs.skip == '0'
        run: npm ci

      - name: Install EAS CLI
        if: steps.guard.outputs.skip == '0'
        run: npm install -g eas-cli

      # Map the git context to the EAS Update branch (= channel of the same
      # name that builds listen to):
      #   develop push        → dev
      #   tag *-rc.* / -beta   → rc
      #   tag vX.Y.Z (stable)  → production
      - name: Resolve update branch
        if: steps.guard.outputs.skip == '0'
        id: branch
        run: |
          ref="${GITHUB_REF}"
          if [[ "$ref" == "refs/heads/develop" ]]; then
            b=dev
          elif [[ "$ref" == refs/tags/* && "$ref" == *-* ]]; then
            b=rc            # any pre-release tag (vX.Y.Z-rc.N, -beta, …)
          else
            b=production    # clean stable tag
          fi
          echo "name=$b" >> "$GITHUB_OUTPUT"
          echo "Publishing to EAS branch: $b"

      - name: Publish update
        if: steps.guard.outputs.skip == '0'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # The branch resolved above maps 1:1 to the channel of the same name
        # that the matching build listens to. `--auto` derives the update
        # message/branch from git; `--non-interactive` bails instead of
        # prompting.
        run: |
          cd apps/native
          eas update \
            --branch "${{ steps.branch.outputs.name }}" \
            --auto \
            --non-interactive \
            --message "${GITHUB_REF_NAME}"
