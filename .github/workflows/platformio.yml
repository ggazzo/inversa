name: Firmware CI

on:
  push:
    tags:
      - "v*"
    branches:
      - develop
      - v2
      - v3
      - v4-tamagui
    paths:
      - "firmware/**"
      - ".github/workflows/platformio.yml"
  pull_request:
    branches:
      - develop
      - v2
      - v3
      - v4-tamagui
    paths:
      - "firmware/**"
      - ".github/workflows/platformio.yml"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run tests
        run: pio test -e native

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: firmware
    strategy:
      matrix:
        env: [wemos_s3_mini, wemos_c3_mini]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # Copy boot_app0.bin out of the arduino-esp32 framework tools dir so the
      # release job can run esptool merge_bin without pulling the full toolchain.
      - name: Stage boot_app0 partition
        run: |
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
             firmware/.pio/build/${{ matrix.env }}/boot_app0.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/.pio/build/${{ matrix.env }}/partitions.bin
            firmware/.pio/build/${{ matrix.env }}/boot_app0.bin

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download S3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-wemos_s3_mini
          path: release/s3

      - name: Download C3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-wemos_c3_mini
          path: release/c3

      - name: Prepare release files
        run: |
          # Versioned files (for users to download manually)
          cp release/s3/firmware.bin release/inversa-s3-mini-${{ github.ref_name }}.bin
          cp release/c3/firmware.bin release/inversa-c3-mini-${{ github.ref_name }}.bin
          # Unversioned files (for OTA auto-update lookup)
          cp release/s3/firmware.bin release/wemos_s3_mini.bin
          cp release/c3/firmware.bin release/wemos_c3_mini.bin

      # Factory bins consumed by docs/ ESP Web Tools installer. esptool's
      # merge_bin produces a single image to flash at offset 0; the chip
      # family flag is set per board because S3 and C3 share the same layout
      # but esptool expects an explicit `--chip`.
      - name: Install esptool
        run: pip install esptool

      - name: Merge factory bins for web installer
        run: |
          esptool.py --chip esp32s3 merge_bin \
            -o release/wemos_s3_mini.factory.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0     release/s3/bootloader.bin \
            0x8000  release/s3/partitions.bin \
            0xe000  release/s3/boot_app0.bin \
            0x10000 release/s3/firmware.bin

          esptool.py --chip esp32c3 merge_bin \
            -o release/wemos_c3_mini.factory.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0     release/c3/bootloader.bin \
            0x8000  release/c3/partitions.bin \
            0xe000  release/c3/boot_app0.bin \
            0x10000 release/c3/firmware.bin

      # P8 — ECDSA P-256 signature over the OTA assets. Firmware refuses
      # an update without a matching `.sig` (see core/OtaVerify.h).
      # OTA_SIGNING_KEY repo secret holds the PEM-encoded private key.
      - name: Sign OTA binaries
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::OTA_SIGNING_KEY secret is not set — release would brick OTA"
            exit 1
          fi
          printf '%s' "$OTA_SIGNING_KEY" > /tmp/ota_priv.pem
          for bin in release/wemos_s3_mini.bin release/wemos_c3_mini.bin; do
            openssl dgst -sha256 -sign /tmp/ota_priv.pem -out "${bin}.sig" "$bin"
          done
          shred -u /tmp/ota_priv.pem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/inversa-s3-mini-${{ github.ref_name }}.bin
            release/inversa-c3-mini-${{ github.ref_name }}.bin
            release/wemos_s3_mini.bin
            release/wemos_s3_mini.bin.sig
            release/wemos_c3_mini.bin
            release/wemos_c3_mini.bin.sig
            release/wemos_s3_mini.factory.bin
            release/wemos_c3_mini.factory.bin
          generate_release_notes: true
