name: Firmware CI

on:
  push:
    tags:
      - "v*"
    branches:
      - develop
      - v2
      - v3
      - v4-tamagui
    paths:
      - "firmware/**"
      - ".github/workflows/platformio.yml"
  pull_request:
    branches:
      - develop
      - v2
      - v3
      - v4-tamagui
    paths:
      - "firmware/**"
      - ".github/workflows/platformio.yml"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run tests
        run: pio test -e native

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: firmware
    strategy:
      matrix:
        env: [wemos_s3_mini, wemos_c3_mini]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # Surface flash usage in the run summary so size regressions are visible
      # per build/PR, and fail if the app image crosses 90% of the partition —
      # an early warning before a release build overflows min_spiffs.
      #
      # We parse the GNU `size` row (text/data/bss) rather than PlatformIO's
      # "Flash:" line: the latter is emitted by esp-idf-size, whose CLI drifts
      # across versions, while the `size` row is stable. `-t size` re-emits it
      # even on a cache hit (a plain `pio run` stays silent then).
      #
      # App image = text + data (code + initialized data flashed to the app
      # partition). bss is ignored on purpose: with PSRAM mapped it counts a
      # 32 MB virtual range and is not a real internal-RAM figure.
      - name: Report flash usage
        run: |
          pio run -e ${{ matrix.env }} -t size | tee size.log
          row=$(awk '/firmware\.elf/ && $1 ~ /^[0-9]+$/ {print}' size.log | tail -1)
          text=$(echo "$row" | awk '{print $1}')
          data=$(echo "$row" | awk '{print $2}')
          app=$((text + data))
          part=1966080   # min_spiffs.csv app partition (0x1E0000)
          # Integer math only — no float/locale pitfalls. pct rounded to 0.1%.
          pct=$(( app * 1000 / part ))
          {
            echo "### Flash size — ${{ matrix.env }}"
            echo ""
            echo "| segment | bytes |"
            echo "|---|---|"
            echo "| .text (code) | $text |"
            echo "| .data (init) | $data |"
            echo "| **app image** | **$app / $part ($((pct/10)).$((pct%10))%)** |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$app" -gt $(( part * 90 / 100 )) ]; then
            echo "::error::App image $((pct/10)).$((pct%10))% of partition exceeds 90%"
            exit 1
          fi

      # Copy boot_app0.bin out of the arduino-esp32 framework tools dir so the
      # release job can run esptool merge_bin without pulling the full toolchain.
      - name: Stage boot_app0 partition
        # `working-directory: firmware` is already set on the job, so the
        # destination path must be relative to that — not `firmware/...`.
        run: |
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
             .pio/build/${{ matrix.env }}/boot_app0.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/.pio/build/${{ matrix.env }}/partitions.bin
            firmware/.pio/build/${{ matrix.env }}/boot_app0.bin

  # ── Rolling dev catalog ──────────────────────────────────────
  # On every develop push, sign the freshly built binaries and publish them
  # to a single rolling "dev" prerelease alongside a builds.json manifest.
  # The web app and the device install-build path consume these — a build
  # the device installs is still ECDSA-verified, so exposing dev builds is
  # safe. The official tagged releases are published by the `release` job;
  # the app lists both (tagged via the Releases API + this prerelease).
  publish-dev:
    name: Publish dev catalog
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags for `git describe`

      - name: Download S3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-wemos_s3_mini
          path: dev/s3

      - name: Download C3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-wemos_c3_mini
          path: dev/c3

      - name: Install esptool
        run: pip install esptool

      # Sign each app image (.bin → .bin.sig) and build a flashable factory
      # image (.factory.bin) for the USB installer's dev entry. Same key and
      # offsets the release job uses, so the device verifies dev builds with
      # the exact path it verifies tagged releases.
      - name: Sign + assemble dev binaries
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::OTA_SIGNING_KEY secret is not set — cannot sign dev builds"
            exit 1
          fi
          printf '%s' "$OTA_SIGNING_KEY" > /tmp/ota_priv.pem
          mkdir -p out

          sign_board() {
            board="$1"; chip="$2"; src="$3"
            cp "$src/firmware.bin" "out/${board}.bin"
            openssl dgst -sha256 -sign /tmp/ota_priv.pem -out "out/${board}.bin.sig" "out/${board}.bin"
            esptool.py --chip "$chip" merge_bin \
              -o "out/${board}.factory.bin" \
              --flash_mode dio --flash_freq 80m --flash_size 4MB \
              0x0     "$src/bootloader.bin" \
              0x8000  "$src/partitions.bin" \
              0xe000  "$src/boot_app0.bin" \
              0x10000 "$src/firmware.bin"
          }
          sign_board wemos_s3_mini esp32s3 dev/s3
          sign_board wemos_c3_mini esp32c3 dev/c3
          shred -u /tmp/ota_priv.pem

      - name: Generate builds.json manifest
        run: |
          set -euo pipefail
          ver="$(git describe --tags --always 2>/dev/null || echo dev)"
          base="https://github.com/${{ github.repository }}/releases/download/dev"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > out/builds.json <<JSON
          {
            "channel": "dev",
            "version": "${ver}",
            "commit": "${{ github.sha }}",
            "updated": "${ts}",
            "builds": [
              { "board": "wemos_s3_mini", "chipFamily": "ESP32-S3",
                "bin": "${base}/wemos_s3_mini.bin",
                "sig": "${base}/wemos_s3_mini.bin.sig",
                "factory": "${base}/wemos_s3_mini.factory.bin" },
              { "board": "wemos_c3_mini", "chipFamily": "ESP32-C3",
                "bin": "${base}/wemos_c3_mini.bin",
                "sig": "${base}/wemos_c3_mini.bin.sig",
                "factory": "${base}/wemos_c3_mini.factory.bin" }
            ]
          }
          JSON
          cat out/builds.json

      # Upsert a single rolling prerelease tagged `dev`; --clobber overwrites
      # the assets in place so the browser_download_url stays stable.
      - name: Publish to rolling dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="$(git describe --tags --always 2>/dev/null || echo dev)"
          notes="Rolling development build — auto-published from develop.
          Version: ${ver}
          Commit: ${{ github.sha }}
          Signed with the project OTA key; the device verifies the signature before installing."
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --prerelease --title "Dev (rolling)" --notes "$notes" --target develop
          else
            gh release edit dev --notes "$notes" --prerelease
          fi
          gh release upload dev out/* --clobber

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download S3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-wemos_s3_mini
          path: release/s3

      - name: Download C3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-wemos_c3_mini
          path: release/c3

      - name: Prepare release files
        run: |
          # Versioned files (for users to download manually)
          cp release/s3/firmware.bin release/brewpilot-s3-mini-${{ github.ref_name }}.bin
          cp release/c3/firmware.bin release/brewpilot-c3-mini-${{ github.ref_name }}.bin
          # Unversioned files (for OTA auto-update lookup)
          cp release/s3/firmware.bin release/wemos_s3_mini.bin
          cp release/c3/firmware.bin release/wemos_c3_mini.bin

      # Factory bins consumed by docs/ ESP Web Tools installer. esptool's
      # merge_bin produces a single image to flash at offset 0; the chip
      # family flag is set per board because S3 and C3 share the same layout
      # but esptool expects an explicit `--chip`.
      - name: Install esptool
        run: pip install esptool

      - name: Merge factory bins for web installer
        run: |
          esptool.py --chip esp32s3 merge_bin \
            -o release/wemos_s3_mini.factory.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0     release/s3/bootloader.bin \
            0x8000  release/s3/partitions.bin \
            0xe000  release/s3/boot_app0.bin \
            0x10000 release/s3/firmware.bin

          esptool.py --chip esp32c3 merge_bin \
            -o release/wemos_c3_mini.factory.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0     release/c3/bootloader.bin \
            0x8000  release/c3/partitions.bin \
            0xe000  release/c3/boot_app0.bin \
            0x10000 release/c3/firmware.bin

      # P8 — ECDSA P-256 signature over the OTA assets. Firmware refuses
      # an update without a matching `.sig` (see core/OtaVerify.h).
      # OTA_SIGNING_KEY repo secret holds the PEM-encoded private key.
      - name: Sign OTA binaries
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::OTA_SIGNING_KEY secret is not set — release would brick OTA"
            exit 1
          fi
          printf '%s' "$OTA_SIGNING_KEY" > /tmp/ota_priv.pem
          for bin in release/wemos_s3_mini.bin release/wemos_c3_mini.bin; do
            openssl dgst -sha256 -sign /tmp/ota_priv.pem -out "${bin}.sig" "$bin"
          done
          shred -u /tmp/ota_priv.pem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/brewpilot-s3-mini-${{ github.ref_name }}.bin
            release/brewpilot-c3-mini-${{ github.ref_name }}.bin
            release/wemos_s3_mini.bin
            release/wemos_s3_mini.bin.sig
            release/wemos_c3_mini.bin
            release/wemos_c3_mini.bin.sig
            release/wemos_s3_mini.factory.bin
            release/wemos_c3_mini.factory.bin
          generate_release_notes: true
