name: Firmware CI

on:
  push:
    tags:
      - "v*"
    branches:
      - develop
      - v2
    paths:
      - "firmware/**"
      - ".github/workflows/platformio.yml"
  pull_request:
    branches:
      - develop
      - v2
    paths:
      - "firmware/**"
      - ".github/workflows/platformio.yml"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run tests
        run: pio test -e native

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: firmware
    strategy:
      matrix:
        env: [wemos_s3_mini, wemos_c3_mini]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/.pio/build/${{ matrix.env }}/partitions.bin

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download S3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-wemos_s3_mini
          path: release/s3

      - name: Download C3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-wemos_c3_mini
          path: release/c3

      - name: Prepare release files
        run: |
          mv release/s3/firmware.bin release/inversa-s3-mini-${{ github.ref_name }}.bin
          mv release/c3/firmware.bin release/inversa-c3-mini-${{ github.ref_name }}.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/inversa-s3-mini-${{ github.ref_name }}.bin
            release/inversa-c3-mini-${{ github.ref_name }}.bin
          generate_release_notes: true
