; Inversa v2 — Homebrewing Temperature Controller
; Single MCU architecture with BLE control via Web Bluetooth

[platformio]
default_envs = wemos_s3_mini
src_dir = src
lib_dir = lib
test_dir = test
data_dir = data

[env]
monitor_speed = 115200
build_unflags = -std=gnu++11

[common_esp]
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    bblanchon/ArduinoJson@^7.4.1
    denyssene/SimpleKalmanFilter@^0.1.0
    adafruit/RTClib@^2.1.4
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; ── NimBLE size optimizations ──
    -D CONFIG_NIMBLE_CPP_ATT_VALUE_INIT_LENGTH=256
    -D CONFIG_BT_NIMBLE_LOG_LEVEL=0
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1
    ; ── General size optimizations ──
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; ── ESP32-S3 Mini ────────────────────────────────────────────
[env:wemos_s3_mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
board_build.filesystem = spiffs
board_build.partitions = min_spiffs.csv
lib_deps = ${common_esp.lib_deps}
build_flags =
    ${common_esp.build_flags}
    -D BOARD_S3_MINI
    -D CORE_DEBUG_LEVEL=0
extra_scripts =
    pre:scripts/auto_firmware_version.py

[env:wemos_s3_mini_debug]
extends = env:wemos_s3_mini
build_type = debug
build_flags =
    ${env:wemos_s3_mini.build_flags}
    -D DEBUG_MODE=1

; ── ESP32-C3 Mini ────────────────────────────────────────────
[env:wemos_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
board_build.filesystem = spiffs
board_build.partitions = min_spiffs.csv
lib_deps = ${common_esp.lib_deps}
build_flags =
    ${common_esp.build_flags}
    -D BOARD_C3_MINI
    -D CONFIG_LOG_DEFAULT_LEVEL=0
extra_scripts =
    pre:scripts/auto_firmware_version.py

[env:wemos_c3_mini_debug]
extends = env:wemos_c3_mini
build_type = debug
build_flags =
    ${env:wemos_c3_mini.build_flags}
    -D DEBUG_MODE=1

; ── Native (unit tests) ─────────────────────────────────────
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -D NATIVE_BUILD
lib_deps =
    throwtheswitch/Unity@^2.6.0
test_build_src = false
test_ignore = embedded/*

; ── Native + coverage (run with: pio test -e native_coverage) ──
[env:native_coverage]
extends = env:native
build_flags =
    ${env:native.build_flags}
    --coverage
    -O0
    -fprofile-arcs
    -ftest-coverage
build_unflags = -O2 -O3 -Os
build_type = debug
extra_scripts = post:scripts/add_coverage_link.py

; ── Brewing simulator (closed-loop ThermalSim, stdio BLE) ──
; Build: pio run -e sim
; Run:   .pio/build/sim/program --recipe samples/IPA.txt --scale 60
[env:sim]
platform = native
build_flags =
    -std=gnu++17
    -D NATIVE_BUILD
    -D SIM_BUILD
    -D BOARD_S3_MINI
    -I sim
    -I src
    -pthread
build_src_filter = +<*> -<main.cpp> +<../sim/main_sim.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.4.1
    denyssene/SimpleKalmanFilter@^0.1.0
lib_ignore =
    NimBLE-Arduino
    SD
    SPI
    Preferences
    WiFi
    WiFiClientSecure
    HTTPClient
    Update
    Wire
    RTClib
build_type = debug
