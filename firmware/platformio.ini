; Inversa v2 — Homebrewing Temperature Controller
; Single MCU architecture with BLE control via Web Bluetooth

[platformio]
default_envs = wemos_s3_mini
src_dir = src
lib_dir = lib
test_dir = test
data_dir = data

[env]
monitor_speed = 115200
build_unflags = -std=gnu++11

; ── Platform: pioarduino fork ────────────────────────────────
; arduino-esp32 v3.x (ESP-IDF v5.4) is NOT shipped by the official
; platformio/espressif32 platform — they're frozen on v2.x. The
; pioarduino fork tracks upstream Espressif and is the only path to
; arduino-esp32 v3.x in PlatformIO today.
;
;   54.03.21-2 = Espressif Arduino v3.2.1 on top of ESP-IDF v5.4.2
;
; Trade-off vs espressif32@6.12.0 (arduino-esp32 v2.0.17 / ESP-IDF v4.4):
;   .flash.text   +17%   (~+147 KB; well within the 4 MB part)
;   .flash.rodata +22%   (~+42 KB)
;   .iram0.text   +16%   (~+13 KB)
;   .dram0.bss    +4%    (~+1.2 KB)
;   .dram0.data   -3%    (~-0.8 KB)
;   RAM internal  +1%    (~+480 B — basically a wash)
;
; The "+1.5 MB RAM" the GNU `size` tool prints is a mirage: when PSRAM is
; mapped (BOARD_HAS_PSRAM) the `extern_ram_seg` (32 MB virtual range) is
; counted toward bss. Use `xtensa-esp32s3-elf-objdump -h ... | grep dram0`
; for the actual internal-RAM footprint.

[common_esp]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32#54.03.21-2
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    bblanchon/ArduinoJson@^7.4.1
    denyssene/SimpleKalmanFilter@^0.1.0
    adafruit/RTClib@^2.1.4
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; ── NimBLE size optimizations ──
    -D CONFIG_NIMBLE_CPP_ATT_VALUE_INIT_LENGTH=256
    -D CONFIG_BT_NIMBLE_LOG_LEVEL=0
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1
    ; ── General size optimizations ──
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
build_src_flags =
    ; -fno-exceptions/-fno-rtti are scoped to src/ only — the prebuilt
    ; arduino-esp32 framework libs (incl. .c sources) must not see them.
    ; LTO is omitted on both v2 and v3 platforms: ESP-IDF ships non-LTO
    ; archives (incl. libfreertos.a), so enabling -flto breaks linking
    ; with `plugin needed to handle lto object` + `undefined reference
    ; to app_main`. Until upstream emits GIMPLE/fat-LTO objects, LTO
    ; stays off.
    -fno-exceptions
    -fno-rtti

; ── ESP32-S3 Mini ────────────────────────────────────────────
[env:wemos_s3_mini]
platform = ${common_esp.platform}
board = lolin_s3_mini
framework = arduino
board_build.filesystem = spiffs
board_build.partitions = min_spiffs.csv
lib_deps = ${common_esp.lib_deps}
build_flags =
    ${common_esp.build_flags}
    -D BOARD_S3_MINI
    -D CORE_DEBUG_LEVEL=0
    -D BLE_MTU_SIZE=185
    -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=185
extra_scripts =
    pre:scripts/auto_firmware_version.py

[env:wemos_s3_mini_debug]
extends = env:wemos_s3_mini
build_type = debug
build_flags =
    ${env:wemos_s3_mini.build_flags}
    -D DEBUG_MODE=1

; ── ESP32-C3 Mini ────────────────────────────────────────────
[env:wemos_c3_mini]
platform = ${common_esp.platform}
board = lolin_c3_mini
framework = arduino
board_build.filesystem = spiffs
board_build.partitions = min_spiffs.csv
lib_deps = ${common_esp.lib_deps}
build_flags =
    ${common_esp.build_flags}
    -D BOARD_C3_MINI
    -D CONFIG_LOG_DEFAULT_LEVEL=0
    -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=5120
    -D BLE_MTU_SIZE=185
    -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=185
extra_scripts =
    pre:scripts/auto_firmware_version.py

[env:wemos_c3_mini_debug]
extends = env:wemos_c3_mini
build_type = debug
build_flags =
    ${env:wemos_c3_mini.build_flags}
    -D DEBUG_MODE=1

; ── Native (unit tests) ─────────────────────────────────────
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -D NATIVE_BUILD
lib_deps =
    throwtheswitch/Unity@^2.6.0
test_build_src = false
test_ignore = embedded/*

; ── Native + coverage (run with: pio test -e native_coverage) ──
[env:native_coverage]
extends = env:native
build_flags =
    ${env:native.build_flags}
    --coverage
    -O0
    -fprofile-arcs
    -ftest-coverage
build_unflags = -O2 -O3 -Os
build_type = debug
extra_scripts = post:scripts/add_coverage_link.py

; ── Brewing simulator (closed-loop ThermalSim, stdio BLE) ──
; Build: pio run -e sim
; Run:   .pio/build/sim/program --recipe samples/IPA.txt --scale 60
[env:sim]
platform = native
build_flags =
    -std=gnu++17
    -D NATIVE_BUILD
    -D SIM_BUILD
    -D BOARD_S3_MINI
    -I sim
    -I src
    -pthread
build_src_filter = +<*> -<main.cpp> +<../sim/main_sim.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.4.1
    denyssene/SimpleKalmanFilter@^0.1.0
lib_ignore =
    NimBLE-Arduino
    SD
    SPI
    Preferences
    WiFi
    WiFiClientSecure
    HTTPClient
    Update
    Wire
    RTClib
build_type = debug
