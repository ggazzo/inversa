; Inversa v2 — Homebrewing Temperature Controller
; Single MCU architecture with BLE control via Web Bluetooth

[platformio]
default_envs = wemos_s3_mini
src_dir = src
lib_dir = lib
test_dir = test
data_dir = data

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    bblanchon/ArduinoJson@^7.4.1
    denyssene/SimpleKalmanFilter@^0.1.0
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_NIMBLE_CPP_ATT_VALUE_INIT_LENGTH=512
build_unflags = -std=gnu++11

; ── ESP32-S3 Mini ────────────────────────────────────────────
[env:wemos_s3_mini]
platform = espressif32
board = lolin_s3_mini
board_build.filesystem = spiffs
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D BOARD_S3_MINI
    -D CORE_DEBUG_LEVEL=3
extra_scripts =
    pre:scripts/auto_firmware_version.py

[env:wemos_s3_mini_debug]
extends = env:wemos_s3_mini
build_type = debug
build_flags =
    ${env:wemos_s3_mini.build_flags}
    -D DEBUG_MODE=1

; ── ESP32-C3 Mini ────────────────────────────────────────────
[env:wemos_c3_mini]
platform = espressif32
board = lolin_c3_mini
board_build.filesystem = spiffs
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D BOARD_C3_MINI
    -D CONFIG_LOG_DEFAULT_LEVEL=0
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
extra_scripts =
    pre:scripts/auto_firmware_version.py

; ── Native (unit tests) ─────────────────────────────────────
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -D NATIVE_BUILD
lib_deps =
    bblanchon/ArduinoJson@^7.4.1
